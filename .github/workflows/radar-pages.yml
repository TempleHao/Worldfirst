name: Publish Worldfirst Website
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar/**"
      - "Fx/**"
      - "!Fx/scripts/**"
      - ".github/workflows/radar-pages.yml"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: worldfirst-pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - uses: actions/deploy-pages@v4
