name: Refresh Radar Search Feeds
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "radar/scripts/**"
      - ".github/workflows/radar-refresh.yml"
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: radar-search-refresh
  cancel-in-progress: false
jobs:
  scrape:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize to latest main revision
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Verify dashboard JavaScript syntax
        run: |
          python -c "from pathlib import Path; h=Path('radar/index.html').read_text(); js=h.rsplit('<script>',1)[1].split('</script>',1)[0]; Path('/tmp/radar-ui.js').write_text(js)"
          node --check /tmp/radar-ui.js
      - name: Fetch public RSS search results
        run: python radar/scripts/collect.py
      - name: Discover publicly indexed social mentions and ingest authorised sources
        env:
          ZHIHU_ACCESS_SECRET: ${{ secrets.ZHIHU_ACCESS_SECRET }}
        run: python radar/scripts/social.py
      - name: Verify social adapter contracts
        run: python -m unittest discover -s radar/scripts -p 'test_social.py' -v
      - name: Verify reputation classifier
        run: python -m unittest discover -s radar/scripts -p 'test_reputation.py' -v
      - name: Enrich news with sentiment and crisis analysis
        run: python radar/scripts/reputation.py
      - name: Commit JSON, Markdown, RSS and status snapshots
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add radar/data/articles.json radar/data/latest.md radar/data/feed.xml radar/data/status.json radar/data/reputation.json radar/data/social-status.json
          if ! git diff --cached --quiet; then
            git commit -m "data(radar): update public search signals"
            git pull --rebase origin main
            git push
          fi
      - name: Publish refreshed site
        uses: actions/configure-pages@v5
      - name: Upload refreshed static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy refreshed site
        uses: actions/deploy-pages@v4
