name: FX - Quality Gates
on:
  pull_request:
    paths:
      - "Fx/**"
      - ".github/workflows/fx-*.yml"
      - ".github/workflows/radar-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and unit tests
        run: |
          python -m py_compile Fx/scripts/collect.py Fx/scripts/test_collect.py Fx/scripts/test_editorial.py Fx/scripts/rates.py Fx/scripts/test_rates.py Fx/scripts/test_site_design.py
          python -m unittest discover -s Fx/scripts -p 'test_*.py' -v
      - name: JavaScript syntax and independent CNH parser
        run: |
          node --check Fx/app.js
          node Fx/scripts/test_cnh.js
          node Fx/scripts/test_data_integrity.js
      - name: Verify external offshore data source and CORS (non-blocking)
        continue-on-error: true
        timeout-minutes: 1
        run: |
          python - <<'PY'
          import datetime, json, urllib.request
          from urllib.parse import urlparse
          url="https://open.er-api.com/v6/latest/USD"
          req=urllib.request.Request(url,headers={"User-Agent":"FX-Intel-SiteSourceCheck/1.0"})
          with urllib.request.urlopen(req, timeout=12) as response:
              data=json.load(response)
              cors=response.headers.get("Access-Control-Allow-Origin")
          assert data.get("result")=="success" and data.get("base_code")=="USD", "bad response base"
          assert 2<float(data.get("rates",{}).get("CNH",0))<20, "no independent CNH quote"
          assert cors in ("*","https://templehao.github.io"), "missing browser CORS permission"
          age=datetime.datetime.now(datetime.timezone.utc).timestamp()-float(data["time_last_update_unix"])
          assert -14400<age<5*86400, "invalid provider observation age"
          print("CNH direct provider valid; date:",data["time_last_update_utc"],
                "; CORS:",cors,"; third-party daily value:",data["rates"]["CNH"])
          PY
      - name: Static publishing and source evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert Path('radar/index.html').exists(), 'existing radar must remain intact'
          assert Path('Fx/index.html').exists() and Path('Fx/style.css').exists()
          assert Path('Fx/scripts/test_site_design.py').exists()
          assert '机制实验室' not in Path('Fx/index.html').read_text()
          data=json.loads(Path('Fx/data/articles.json').read_text())
          assert data.get('window_hours')==168 and isinstance(data['articles'],list)
          editorial=json.loads(Path('Fx/data/editorial.json').read_text())
          assert editorial.get('schema_version')==1
          assert isinstance(editorial.get('items'),dict)
          market=json.loads(Path('Fx/data/market.json').read_text())
          assert market.get('quote_type')=='official_daily_reference_not_realtime_or_executable'
          assert isinstance(market.get('instruments'), list)
          for r in market['instruments']:
              assert r['pair'] and r['date'] and float(r['value'])>0 and r['source_url']
              assert r['kind'] in {'official_daily_reference','official_daily_reference_cross'}
          ai=json.loads(Path('Fx/data/ai-brief.json').read_text())
          if ai.get('reviewed'):
              ids={article['id'] for article in data['articles']}
              assert ai.get('method')=='chatgpt_review_with_cited_sources'
              for claim in ai.get('claims',[]):
                  assert claim['evidence_ids'] and set(claim['evidence_ids']).issubset(ids)
          print('7-day feed, radar coexistence, and evidence contract validated')
          PY
