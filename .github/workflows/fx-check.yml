name: FX - Quality Gates
on:
  pull_request:
    paths:
      - "Fx/**"
      - ".github/workflows/fx-*.yml"
      - ".github/workflows/radar-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax and unit tests
        run: |
          python -m py_compile Fx/scripts/collect.py Fx/scripts/test_collect.py Fx/scripts/test_editorial.py
          python -m unittest discover -s Fx/scripts -p 'test_*.py' -v
      - name: JavaScript syntax
        run: node --check Fx/app.js
      - name: Static publishing and source evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          assert Path('radar/index.html').exists(), 'existing radar must remain intact'
          assert Path('Fx/index.html').exists() and Path('Fx/style.css').exists()
          assert '机制实验室' not in Path('Fx/index.html').read_text()
          data=json.loads(Path('Fx/data/articles.json').read_text())
          assert data.get('window_hours')==168 and isinstance(data['articles'],list)
          editorial=json.loads(Path('Fx/data/editorial.json').read_text())
          assert editorial.get('schema_version')==1
          assert isinstance(editorial.get('items'),dict)
          ai=json.loads(Path('Fx/data/ai-brief.json').read_text())
          if ai.get('reviewed'):
              ids={article['id'] for article in data['articles']}
              assert ai.get('method')=='chatgpt_review_with_cited_sources'
              for claim in ai.get('claims',[]):
                  assert claim['evidence_ids'] and set(claim['evidence_ids']).issubset(ids)
          print('7-day feed, radar coexistence, and evidence contract validated')
          PY
